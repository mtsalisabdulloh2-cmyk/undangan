<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan · Usawatun & Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 1.5rem;
      /* Ganti URL di bawah dengan tautan langsung gambar Anda */
      background-image: img src="https://google.com" alt="https://drive.google.com/file/d/1-T4YaHFEk4YZtQA1NYf2SyHKaL7zfSib/view?usp=drive_link"
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* Lapisan transparan agar teks tetap terbaca */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 248, 240, 0.6); /* sesuaikan tingkat transparansi */
      backdrop-filter: blur(2px); /* efek blur halus pada background */
      z-index: 0;
    }

    .wedding-card {
      max-width: 720px;
      width: 100%;
      background: rgba(255, 251, 247, 0.92);
      border-radius: 40px;
      box-shadow: 0 20px 40px -12px rgba(60, 40, 25, 0.3);
      padding: 3rem 2rem 3.2rem;
      text-align: center;
      border: 1px solid rgba(230, 210, 190, 0.3);
      position: relative;
      z-index: 1;
      overflow: hidden;
      backdrop-filter: blur(4px);
    }

    /* ornamen dekoratif */
    .wedding-card::before {
      content: "❀";
      position: absolute;
      top: 15px;
      left: 25px;
      font-size: 2rem;
      color: #dcc2a7;
      opacity: 0.3;
    }

    .wedding-card::after {
      content: "❀";
      position: absolute;
      bottom: 15px;
      right: 25px;
      font-size: 2rem;
      color: #dcc2a7;
      opacity: 0.3;
    }

    .border-ornament {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid rgba(210, 185, 165, 0.2);
      border-radius: 32px;
      pointer-events: none;
    }

    .headline {
      font-size: 1.2rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #a5846b;
      font-weight: 400;
      margin-bottom: 1.8rem;
      display: inline-block;
      border-bottom: 1.5px solid #e4d3c2;
      padding: 0 0.6rem 0.4rem;
      position: relative;
      z-index: 2;
    }

    .names-container {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      position: relative;
      z-index: 2;
    }

    .name {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #3d2c1d;
      line-height: 1.2;
      padding: 0.15rem 0;
      opacity: 0;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(255, 215, 175, 0.1);
    }

    .name-left {
      background: linear-gradient(135deg, #3f2b1a, #2a1c11);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .name-right {
      background: linear-gradient(135deg, #3f2b1a, #281b10);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Animasi 3x lebih lambat */
    .name-left {
      animation: slideFromLeft 3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.3s;
      transform: translateX(-100%);
      opacity: 0;
    }

    .name-right {
      animation: slideFromRight 3s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.6s;
      transform: translateX(100%);
      opacity: 0;
    }

    @keyframes slideFromLeft {
      0% {
        transform: translateX(-80%);
        opacity: 0;
        filter: blur(2px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes slideFromRight {
      0% {
        transform: translateX(80%);
        opacity: 0;
        filter: blur(2px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    @media (max-width: 640px) {
      .wedding-card {
        padding: 2rem 1.2rem 2.4rem;
        border-radius: 32px;
      }

      .headline {
        font-size: 0.95rem;
        letter-spacing: 5px;
        margin-bottom: 1.4rem;
      }

      .name {
        font-size: 2.4rem;
        letter-spacing: 2px;
        white-space: normal;
        word-break: break-word;
      }
    }

    @media (max-width: 430px) {
      .headline {
        font-size: 0.75rem;
        letter-spacing: 4px;
      }

      .name {
        font-size: 1.8rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="wedding-card">
    <div class="border-ornament"></div>
    <div class="headline">THE WEDDING OF</div>
    <div class="names-container">
      <div class="name name-left">USWATUN HASANAH</div>
      <div class="name name-right">ERIK ADI PRASETIYO</div>
    </div>
  </div>
</body>
</html>
