<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Undangan · Usawatun & Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      background-image: url('https://priapsikologi.wordpress.com/wp-content/uploads/2026/03/img-20260625-wa0004.jpg.jpeg?w=682&allow_lossy=1');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden;
    }

    /* Lapisan transparan agar teks terbaca */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 248, 240, 0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      width: 100%;
      max-width: 500px;
    }

    .headline {
      font-size: 0.9rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #a5846b;
      font-weight: 400;
      margin-bottom: 1.5rem;
      display: inline-block;
      border-bottom: 2px solid rgba(165, 132, 107, 0.4);
      padding: 0 0.6rem 0.5rem;
      position: relative;
      z-index: 2;
    }

    .names-container {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      position: relative;
      z-index: 2;
    }

    .name {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      line-height: 1.2;
      padding: 0.1rem 0;
      opacity: 0;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .name-left {
      background: linear-gradient(135deg, #3f2b1a, #5a3d2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 3.8rem;
    }

    .name-right {
      background: linear-gradient(135deg, #3f2b1a, #5a3d2b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 3.8rem;
    }

    /* Animasi */
    .name-left {
      animation: slideFromLeft 2.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.3s;
      transform: translateX(-100%);
      opacity: 0;
    }

    .name-right {
      animation: slideFromRight 2.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.6s;
      transform: translateX(100%);
      opacity: 0;
    }

    @keyframes slideFromLeft {
      0% {
        transform: translateX(-60%);
        opacity: 0;
        filter: blur(3px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes slideFromRight {
      0% {
        transform: translateX(60%);
        opacity: 0;
        filter: blur(3px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    /* ===== UKURAN ANDROID / HP ===== */
    @media (max-width: 480px) {
      .container {
        padding: 1rem;
      }

      .headline {
        font-size: 0.75rem;
        letter-spacing: 6px;
        margin-bottom: 1.2rem;
        padding: 0 0.4rem 0.4rem;
      }

      .name {
        font-size: 2.6rem;
        letter-spacing: 2px;
      }

      .name-left,
      .name-right {
        font-size: 2.8rem;
      }
    }

    @media (max-width: 380px) {
      .headline {
        font-size: 0.65rem;
        letter-spacing: 5px;
        margin-bottom: 0.8rem;
      }

      .name {
        font-size: 2rem;
        letter-spacing: 1.5px;
      }

      .name-left,
      .name-right {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 280px) {
      .headline {
        font-size: 0.5rem;
        letter-spacing: 3px;
      }

      .name {
        font-size: 1.5rem;
      }

      .name-left,
      .name-right {
        font-size: 1.6rem;
      }
    }

    /* Landscape */
    @media (max-height: 500px) and (orientation: landscape) {
      .container {
        max-width: 400px;
        padding: 0.8rem;
      }

      .headline {
        font-size: 0.6rem;
        margin-bottom: 0.6rem;
      }

      .name {
        font-size: 2rem;
      }

      .name-left,
      .name-right {
        font-size: 2.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="headline">THE WEDDING OF</div>
    <div class="names-container">
      <div class="name name-left">USWATUN HASANAH</div>
      <div class="name name-right">ERIK ADI PRASETIYO</div>
    </div>
  </div>
</body>
</html>
