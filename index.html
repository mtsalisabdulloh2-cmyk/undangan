<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1600, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Undangan · Usawatun & Erik</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
      background-image: url('https://priapsikologi.wordpress.com/wp-content/uploads/2026/03/img-20260625-wa0004.jpg.jpeg?w=682&allow_lossy=1');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      /* Resolusi 1600x720 */
      width: 100vw;
      height: 100vh;
    }

    /* Lapisan transparan gelap agar teks terbaca */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 1.5rem;
      width: 100%;
      max-width: 1600px;
      /* TIDAK ADA background! */
    }

    .headline {
      font-size: 1.8rem;
      letter-spacing: 12px;
      text-transform: uppercase;
      color: #f0e0d0;
      font-weight: 400;
      margin-bottom: 2.5rem;
      display: inline-block;
      border-bottom: 3px solid rgba(240, 224, 208, 0.4);
      padding: 0 1rem 0.8rem;
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
    }

    .names-container {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      position: relative;
      z-index: 2;
    }

    .name {
      font-size: 7rem;
      font-weight: 700;
      letter-spacing: 6px;
      line-height: 1.2;
      padding: 0.2rem 0;
      opacity: 0;
      white-space: normal;
      word-break: break-word;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
    }

    .name-left {
      color: #fff5e8;
      font-size: 7.5rem;
    }

    .name-right {
      color: #fff5e8;
      font-size: 7.5rem;
    }

    /* Animasi */
    .name-left {
      animation: slideFromLeft 2.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.3s;
      transform: translateX(-100%);
      opacity: 0;
    }

    .name-right {
      animation: slideFromRight 2.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
      animation-delay: 0.6s;
      transform: translateX(100%);
      opacity: 0;
    }

    @keyframes slideFromLeft {
      0% {
        transform: translateX(-60%);
        opacity: 0;
        filter: blur(4px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    @keyframes slideFromRight {
      0% {
        transform: translateX(60%);
        opacity: 0;
        filter: blur(4px);
      }
      70% {
        opacity: 0.9;
        filter: blur(0);
      }
      100% {
        transform: translateX(0);
        opacity: 1;
        filter: blur(0);
      }
    }

    /* ===== RESOLUSI 1600x720 ===== */
    @media (max-width: 1600px) and (max-height: 720px) {
      .container {
        padding: 1rem 2rem;
        max-width: 100%;
      }

      .headline {
        font-size: 1.6rem;
        letter-spacing: 10px;
        margin-bottom: 2rem;
        padding: 0 0.8rem 0.6rem;
        border-bottom-width: 2.5px;
      }

      .name {
        font-size: 5.5rem;
        letter-spacing: 5px;
      }

      .name-left,
      .name-right {
        font-size: 6rem;
      }
    }

    /* ===== UKURAN ANDROID FULL SCREEN ===== */
    @media (max-width: 480px) {
      .container {
        padding: 0.8rem;
        max-width: 100%;
      }

      .headline {
        font-size: 0.7rem;
        letter-spacing: 5px;
        margin-bottom: 1rem;
        padding: 0 0.3rem 0.3rem;
        border-bottom-width: 1.5px;
      }

      .name {
        font-size: 2.4rem;
        letter-spacing: 1.5px;
      }

      .name-left,
      .name-right {
        font-size: 2.6rem;
      }
    }

    @media (max-width: 380px) {
      .container {
        padding: 0.5rem;
      }

      .headline {
        font-size: 0.6rem;
        letter-spacing: 4px;
        margin-bottom: 0.7rem;
      }

      .name {
        font-size: 1.8rem;
        letter-spacing: 1px;
      }

      .name-left,
      .name-right {
        font-size: 2rem;
      }
    }

    @media (max-width: 280px) {
      .headline {
        font-size: 0.45rem;
        letter-spacing: 3px;
        margin-bottom: 0.5rem;
      }

      .name {
        font-size: 1.3rem;
      }

      .name-left,
      .name-right {
        font-size: 1.5rem;
      }
    }

    /* Landscape */
    @media (max-height: 500px) and (orientation: landscape) {
      .container {
        max-width: 400px;
        padding: 0.5rem;
      }

      .headline {
        font-size: 0.55rem;
        margin-bottom: 0.5rem;
        padding: 0 0.2rem 0.2rem;
      }

      .name {
        font-size: 1.8rem;
      }

      .name-left,
      .name-right {
        font-size: 2rem;
      }
    }

    /* HP dengan notch/punch hole */
    @supports (padding: max(0px)) {
      .container {
        padding-left: max(1rem, env(safe-area-inset-left));
        padding-right: max(1rem, env(safe-area-inset-right));
        padding-top: max(1rem, env(safe-area-inset-top));
        padding-bottom: max(1rem, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="headline">THE WEDDING OF</div>
    <div class="names-container">
      <div class="name name-left">USWATUN HASANAH</div>
      <div class="name name-right">ERIK ADI PRASETIYO</div>
    </div>
  </div>
</body>
</html>
